<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toolbench: developer tools that run in your browser</title>
<meta name="description" content="Offline-first developer utilities in one tabbed workspace: JSON and XML path finders, diff, converters, JWT, regex, certificates, notes and more. Nothing you paste leaves your browser.">

<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48x48.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#1a1713">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,600,50,0&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/sql/sql.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/yaml/yaml.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body data-theme="graphite" data-kind="dark">
<div id="app">

  <header id="topbar">
    <button class="tb-btn tb-hamburger" id="hamburger-btn" title="Toggle sidebar" aria-label="Toggle sidebar" aria-controls="sidebar">&#9776;</button>
    <!-- Wordmark is text on purpose: no final logo has been chosen for the rebrand yet. -->
    <div class="brand" aria-label="Toolbench"><span class="wordmark">Tool<b>bench</b></span></div>
    <button type="button" class="tb-search" id="open-palette-btn" aria-label="Search tools and commands" aria-keyshortcuts="Control+K Meta+K">
      <span aria-hidden="true">&#8981;</span><span class="tb-search-label">Search tools and commands</span>
      <kbd>Ctrl K</kbd>
    </button>
    <div class="tb-spacer"></div>
    <button class="tb-btn" id="import-btn" title="Import a file into a matching tool" aria-label="Import a file"><span aria-hidden="true">&#8593;</span> <span>Import</span></button>
    <button class="tb-btn" id="fullscreen-btn" title="Toggle fullscreen (F11)" aria-label="Toggle fullscreen">&#10021;</button>
    <button class="tb-btn" id="theme-btn" title="Toggle dark and light theme" aria-label="Toggle dark and light theme">&#9788;</button>
    <button class="tb-btn" id="settings-btn" title="Settings" aria-label="Open settings">&#9881;</button>
  </header>
  <div id="sidebar-backdrop"></div>

  <div id="body-row">
    <nav id="sidebar" aria-label="Tools">
      <div class="side-search"><label class="sr-only" for="tool-filter">Filter tools</label><input id="tool-filter" placeholder="Filter tools" autocomplete="off"></div>
      <div class="side-scroll" id="side-scroll"></div>
      <button type="button" id="sidebar-toggle" aria-label="Collapse or expand the sidebar"><span id="collapse-ic" aria-hidden="true">&#9664;</span><span class="side-label">Collapse</span></button>
    </nav>

    <main id="main-col">
      <div id="tabbar" role="tablist" aria-label="Open tools"></div>
      <div id="workspace">
        <div class="empty-state" id="empty-state">
          <h1>The bench is clear</h1>
          <p>Open a tool from the sidebar, or press <kbd>Ctrl K</kbd> to search them all. Your last set of tabs comes back when you reload.</p>
          <p class="privacy">Everything you paste stays in this browser.</p>
        </div>
      </div>
    </main>
  </div>

  <footer id="statusbar">
    <div class="seg" id="sb-tool">Ready</div>
    <div class="seg" id="sb-status" role="status" aria-live="polite"></div>
    <div class="sp"></div>
    <div class="seg" id="sb-meta"></div>
    <div class="seg">UTF-8</div>
    <div class="seg" id="sb-tabs-count">0 tabs open</div>
  </footer>
</div>

<input type="file" id="hidden-file-input" hidden aria-label="Choose a file to import">

<div class="overlay" id="palette-overlay">
  <div class="palette" role="dialog" aria-modal="true" aria-label="Command palette">
    <label class="sr-only" for="palette-input">Tool or command name</label>
    <input id="palette-input" placeholder="Type a tool name or command" autocomplete="off" role="combobox" aria-expanded="true" aria-controls="palette-list">
    <div class="palette-list" id="palette-list" role="listbox" aria-label="Matching tools and commands"></div>
  </div>
</div>

<div class="overlay" id="settings-overlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="modal-head"><span id="settings-title">Settings</span> <button class="icon-btn" id="settings-close" aria-label="Close settings">&#10005;</button></div>
    <div class="modal-body">
      <div class="set-row"><label for="set-theme">Theme</label>
        <select class="mini" id="set-theme">
          <optgroup label="Dark"><option value="graphite">Graphite (brass)</option><option value="ember">Ember (coral)</option><option value="solder">Solder (lime)</option></optgroup>
          <optgroup label="Light"><option value="paper">Paper (brass)</option><option value="sage">Sage (green)</option></optgroup>
        </select>
      </div>
      <div class="set-row"><label for="set-fontsize">Editor font size</label>
        <select class="mini" id="set-fontsize"><option>12</option><option>13</option><option>14</option><option>15</option><option>16</option></select>
      </div>
      <div class="set-row"><label for="set-indent">Indent size</label>
        <select class="mini" id="set-indent"><option>2</option><option>4</option></select>
      </div>
      <div class="set-row"><label for="set-restore">Restore tabs on reload</label>
        <input type="checkbox" id="set-restore" checked>
      </div>
      <div class="set-row"><label for="clear-workspace">Clear saved workspace</label>
        <button class="btn" id="clear-workspace">Clear</button>
      </div>
    </div>
  </div>
</div>

<div id="toast-stack" aria-live="polite"></div>

<script defer src="app.js"></script>
</body>
</html>
